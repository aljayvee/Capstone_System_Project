<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sugo on the Go - Express Errand & Dispatch Portal</title>
    <meta name="description" content="Official logistics, dispatch, and errand delivery management portal for Sugo on the Go in Tacurong City." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="copyright" content="Sugo on the Go" />
    
    <!-- Preconnect to API Origin for Faster First Contentful Paint -->
    <link rel="preconnect" href="https://api.sugo-express.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.sugo-express.org" />

    <!-- Start the dashboard's text and peso-symbol fonts before CSS discovery. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/urbanist/files/urbanist-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/urbanist/files/urbanist-latin-ext-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2" />

    <!-- Favicon & Touch Icons for Browsers and Google Search -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png?v=d2ff01e8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=33c51817" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=d2ff01e8" />

    <!-- Open Graph Metadata (Site Name & Social Cards) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sugo on the Go" />
    <meta property="og:title" content="Sugo on the Go - Express Errand & Dispatch Portal" />
    <meta property="og:description" content="Official logistics, dispatch, and errand delivery management portal for Sugo on the Go in Tacurong City." />
    <meta property="og:url" content="https://portal.sugo-express.org" />
    <meta property="og:image" content="https://portal.sugo-express.org/logo.png?v=d2ff01e8" />

    <!-- Google Search Structured Data (Site Name & Logo) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Sugo on the Go",
      "alternateName": ["SUGO", "SUGO Express", "Sugo System Portal"],
      "url": "https://portal.sugo-express.org"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
