<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Sugo on the Go - Express Errand & Dispatch Portal</title>
    <meta name="description" content="Official logistics, dispatch, and errand delivery management portal for Sugo on the Go in Tacurong City." />

    <!-- Preconnect to API Origin for Faster First Contentful Paint -->
    <link rel="preconnect" href="https://api.sugoonthego.online" crossorigin />

    <!-- Favicon & Touch Icons for Browsers and Google Search -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph Metadata (Site Name & Social Cards) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sugo on the Go" />
    <meta property="og:title" content="Sugo on the Go - Express Errand & Dispatch Portal" />
    <meta property="og:description" content="Official logistics, dispatch, and errand delivery management portal for Sugo on the Go in Tacurong City." />
    <meta property="og:url" content="https://sugo-express.org" />
    <meta property="og:image" content="https://sugo-express.org/logo.png" />

    <!-- Google Search Structured Data (Site Name & Logo) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Sugo on the Go",
      "alternateName": ["SUGO", "SUGO Express", "Sugo System Portal"],

    </script>
  </head>

    <div id="root"></div>
